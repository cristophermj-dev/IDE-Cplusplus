name: Build Windows (.exe + instalador)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Compilar en Windows
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar MeriCode.exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MeriCode main.py

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Construir el instalador (MeriCode-Setup.exe)
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: MeriCode-Windows
          path: |
            dist\MeriCode.exe
            dist\MeriCode-Setup.exe
